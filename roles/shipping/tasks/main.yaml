  - name: Install maven and mysql
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: present
    loop:
    - maven
    - mysql  

  - name: Install PYsql and cryptography
    ansible.builtin.dnf:
      name: "{{ item }}"
      executable: pip3.9
    loop:
    - cryptography
    - PymySql  

