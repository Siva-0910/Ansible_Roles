  - name: app set up
    include_role:
      name: common
      tasks_from: appsetup

  - name: install maven dependies
    ansible.builtin.command: mvn clean package
    args:
      chdir: /app

  - name: systemd service
    include_role:
      name: common
      tasks_from: systemd   

