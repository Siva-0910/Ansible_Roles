- name: app setup
  include_role:
    name: common
    tasks_from: appsetup

- name: install python dependies
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
  - python3
  - gcc3
  - python-devel     

- name: download dependencies
  ansible.builtin.pip:
  requirements: requirements.txt
  executable: pip.3.9
  args:
    chdir: /app   